name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-c-app/package-lock.json

      - name: Install Product C app dependencies
        working-directory: product-c-app
        run: npm ci

      - name: Lint Product C app
        working-directory: product-c-app
        run: npm run lint

      - name: Typecheck Product C app
        working-directory: product-c-app
        run: npm run typecheck

      - name: Test Product C app
        working-directory: product-c-app
        run: npm test

      - name: Build Product C app
        working-directory: product-c-app
        run: npm run build
