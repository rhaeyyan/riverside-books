name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repo-scoped, no npm install — stays fast and keeps running as each product
  # scaffolds its own app and adds its own job alongside `ci` below.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check docs don't claim npm scripts that don't exist
        run: python3 .github/scripts/check-doc-commands.py

  # The commit rules, checked where they actually hold.
  #
  # `.husky/commit-msg` is not installed in any clone of this repo: no
  # package.json declares husky, commitlint, or lint-staged, none has a
  # `prepare` script, and `.git/hooks/` holds nothing but samples. Conventional
  # Commits and the no-AI-trailer rule have therefore been documentation, not
  # enforcement, in every doc that claims otherwise. Behaviour held anyway (zero
  # AI trailers in the whole history), which is exactly why it went unnoticed.
  #
  # Checking the PR's own commit range in CI makes both rules true for every
  # contributor and every agent session with no local install step, and it
  # survives `--no-verify`, which a local hook cannot. The hooks stay as a fast
  # pre-flight for whoever does wire them up; this is the authoritative gate,
  # matching the split AGENTS.md already describes.
  #
  # Skipped on pushes to main: there is no PR range to check, and a job skipped
  # by a job-level `if` still satisfies a required status check.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs both ends of the range, not just a shallow tip.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # `npx --package` rather than an install: there is no root package.json to
      # install into, and creating one would change what Dependabot and
      # check-doc-commands.py see. Verified to resolve commitlint.config.cjs's
      # `extends` from the npx cache and to leave the working tree untouched.
      - name: Conventional Commits
        run: >
          npx --yes
          --package @commitlint/cli
          --package @commitlint/config-conventional
          -- commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      # Same regex as .husky/commit-msg, applied per commit in the range so a
      # trailer cannot slip in on any commit but the last.
      - name: No AI Co-Authored-By trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if git show -s --format='%B' "$sha" \
              | grep -qiE '^co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt-|copilot|gemini|codex|\bai\b)'; then
              echo "::error::$sha $(git show -s --format='%s' "$sha") — AI Co-Authored-By trailer"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Remove the Co-Authored-By line attributing the commit to an AI tool." >&2
            exit 1
          fi
          echo "OK — no AI Co-Authored-By trailers in this PR's commits."

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-c-app/package-lock.json

      - name: Install Product C app dependencies
        working-directory: product-c-app
        run: npm ci

      - name: Lint Product C app
        working-directory: product-c-app
        run: npm run lint

      - name: Typecheck Product C app
        working-directory: product-c-app
        run: npm run typecheck

      - name: Test Product C app
        working-directory: product-c-app
        run: npm test

      - name: Build Product C app
        working-directory: product-c-app
        run: npm run build

  ci-product-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-b-app/package-lock.json

      - name: Install Product B app dependencies
        working-directory: product-b-app
        run: npm ci

      - name: Lint Product B app
        working-directory: product-b-app
        run: npm run lint

      - name: Typecheck Product B app
        working-directory: product-b-app
        run: npm run typecheck

      - name: Test Product B app
        working-directory: product-b-app
        run: npm test

      - name: Build Product B app
        working-directory: product-b-app
        run: npm run build

      # Deploy only runs for pushes to main — never for PR runs, so unmerged
      # or fork-authored code can't reach production. lint/typecheck/test/build
      # above still run on every PR as the actual gate. `VERCEL_PRODUCT_B_TOKEN`
      # scopes to a Personal Account or Team, not to an individual project —
      # `VERCEL_PRODUCT_B_PROJECT_ID` (paired with the shared `VERCEL_ORG_ID`)
      # is what actually targets this deploy at Product B's own Vercel project.
      - name: Install Vercel CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global vercel@latest

      - name: Pull Product B Vercel project settings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-b-app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_PRODUCT_B_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCT_B_PROJECT_ID }}

      - name: Build Product B for Vercel deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-b-app
        run: vercel build --prod --token=${{ secrets.VERCEL_PRODUCT_B_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCT_B_PROJECT_ID }}

      - name: Deploy Product B to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-b-app
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_PRODUCT_B_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCT_B_PROJECT_ID }}

  ci-product-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-a-app/package-lock.json

      - name: Install Product A app dependencies
        working-directory: product-a-app
        run: npm ci

      - name: Lint Product A app
        working-directory: product-a-app
        run: npm run lint

      - name: Typecheck Product A app
        working-directory: product-a-app
        run: npm run typecheck

      - name: Test Product A app
        working-directory: product-a-app
        run: npm test

      # The database oracle below runs against a real Postgres, because
      # constraints, RLS policies, and transaction races are enforced by
      # Postgres or not at all — none of them are observable against a fake.
      # There is deliberately no skip guard: if the stack fails to come up,
      # `npm run test:db` fails and this job goes red. A database test that
      # skips itself when the database is missing is not an oracle.
      #
      # `supabase/setup-cli` rather than a `supabase` devDependency: the npm
      # package downloads a platform-specific binary on every `npm ci`, and
      # this same job's `npm ci` also feeds the Vercel production deploy
      # below, which has no use for the CLI.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Start Supabase local database (Product A)
        working-directory: product-a-app
        run: supabase db start

      - name: Database tests (Product A)
        working-directory: product-a-app
        run: npm run test:db
        env:
          # The db port from product-a-app/supabase/config.toml, not the 54321
          # API port.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Build Product A app
        working-directory: product-a-app
        run: npm run build

      # Deploy only runs for pushes to main — never for PR runs, so unmerged
      # or fork-authored code can't reach production. lint/typecheck/test/build
      # above still run on every PR as the actual gate.
      # Credential scope, stated here because secret values are unreviewable by
      # construction — they're write-only in GitHub and `.vercel/` is gitignored,
      # so nothing about a mis-scoped token is visible in any artifact a review
      # reads. VERCEL_TOKEN must be an ACCOUNT-scoped token, not one scoped to a
      # single project: a project-scoped token authenticates fine and then fails
      # the project lookup with `Could not retrieve Project Settings` — the same
      # error a wrong VERCEL_PROJECT_ID produces, which is what made this job
      # fail on every run from f9935df until the token was re-minted.
      # VERCEL_ORG_ID / VERCEL_PROJECT_ID identify Product A's project only.
      # Products B, C, and D each need their own token and their own secret
      # names; these will not work for another project.
      - name: Install Vercel CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-a-app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-a-app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-a-app
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  ci-product-d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-d/package-lock.json

      - name: Install Product D dependencies
        working-directory: product-d
        run: npm ci

      - name: Lint Product D app
        working-directory: product-d
        run: npm run lint

      - name: Typecheck Product D app
        working-directory: product-d
        run: npm run typecheck

      - name: Test Product D app
        working-directory: product-d
        run: npm test

      - name: Build Product D app
        working-directory: product-d
        run: npm run build

      # Production credentials are never exposed to pull-request code. A push
      # to main must deploy successfully; missing Product D credentials fail
      # visibly instead of turning deployment into a silent no-op.
      - name: Install Vercel CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global vercel@latest

      - name: Pull Product D Vercel project settings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-d
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_PRODUCT_D_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCT_D_PROJECT_ID }}

      - name: Build Product D for Vercel deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-d
        run: vercel build --prod --token=${{ secrets.VERCEL_PRODUCT_D_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCT_D_PROJECT_ID }}

      - name: Deploy Product D to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: product-d
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_PRODUCT_D_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCT_D_PROJECT_ID }}
