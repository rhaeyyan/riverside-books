version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - rhaeyyan
    # Conventional Commits are enforced by commitlint in .husky/commit-msg.
    # Without this prefix every Dependabot PR would be rejected at commit time.
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    reviewers:
      - rhaeyyan
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
