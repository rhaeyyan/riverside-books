version: 2

updates:
  - package-ecosystem: npm
    # One entry per scaffolded app, not `directory: /`. There is no root
    # package.json, so the previous `/` matched nothing: in this repo's life
    # Dependabot has opened exactly one PR (#1, the actions group below, which
    # does resolve from `/`), while ~90 npm dependencies across three lockfiles
    # went unchecked. Add the next product's app here when it scaffolds.
    directories:
      - /product-a-app
      - /product-b-app
      - /product-c-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - rhaeyyan
    # Conventional Commits are enforced by the `commits` job in ci.yml (the
    # .husky/commit-msg hook this used to cite is not installed in any clone).
    # Without this prefix every Dependabot PR would fail that check.
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    reviewers:
      - rhaeyyan
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
